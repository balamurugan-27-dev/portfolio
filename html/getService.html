<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Service | FueWorks</title>
    <link rel="stylesheet" href="/css/getservice.css">
</head>

<body>

    <section class="get-service">

        <div class="service-header">
            <h1>Get Started With FueWorks</h1>
            <p>
                Tell us what you need, and our team will help turn your
                idea into a professional digital solution.
            </p>
        </div>

        <div class="service-form-container">

            <form class="service-form">

                <h2>Book a Service</h2>

                <!-- Service Selection -->
                <div class="form-group">
                    <label for="service">Choose Service</label>

                    <select id="service" name="service" required>
                        <option value="" disabled selected>
                            Select a service
                        </option>

                        <option value="web-application">
                            Web Application
                        </option>

                        <option value="mobile-application">
                            Mobile Application
                        </option>

                        <option value="both">
                            Web & Mobile Application
                        </option>
                    </select>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <!-- Project Details -->
                <div class="form-group">
                    <label for="message">Tell Us About Your Project</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Describe your project or requirements..."
                    ></textarea>
                </div>

                <!-- Submit -->
                <button type="submit">
                    Book Service
                </button>

            </form>

        </div>

    </section>

</body>
</html>
